name: Auto-Update Blocklist

on:
  schedule:
    # Runs automatically every Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to run it manually anytime with one click

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Open-Source Blocklist Feed
        run: |
          python -c "
          import urllib.request
          
          # Pulling from a reputable open-source domain blocklist
          url = 'https://raw.githubusercontent.com/blocklistproject/Lists/master/porn.txt'
          
          print('Fetching fresh blocklist feed...')
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  raw_lines = response.read().decode('utf-8').splitlines()
              
              # Filter out comments and empty lines
              cleaned_domains = []
              for line in raw_lines:
                  line = line.strip()
                  if line and not line.startswith('#'):
                      cleaned_domains.append(line)
                      
              # Save directly to blocklist.txt
              with open('blocklist.txt', 'w', encoding='utf-8') as f:
                  f.write('\n'.join(cleaned_domains) + '\n')
                  
              print(f'Successfully updated blocklist.txt with {len(cleaned_domains)} domains.')
          except Exception as e:
              print(f'Error fetching blocklist: {e}')
              exit(1)
          "

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Automated bot: refreshed blocklist feed"
          file_pattern: blocklist.txt
